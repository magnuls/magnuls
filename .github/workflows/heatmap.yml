name: Update profile cards

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:        # run manually from the Actions tab
  push:
    paths: [".github/workflows/heatmap.yml"]   # re-render when you edit this file

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Renders into assets/:
      #   overview.svg           contribution heatmap (recent weeks, contributed days blink),
      #                          most-used-languages bar, commit clock, scrolling ticker tape
      #   progress-<slug>.svg    animated progress bar per project
      - uses: actions/github-script@v7
        with:
          script: |
            // ---------- Edit these ----------
            const PROJECTS = [
              { slug: "fill-or-kill",        pct: 60 },
              { slug: "lockfree-structures", pct: 40 },
              { slug: "cache-performance",   pct: 90 },
            ];
            const WEEKS_SHOWN = 27;     // ~5 months, most recent
            const EXCLUDE_REPOS = [];   // e.g. ["old-class-project"]
            const EXCLUDE_LANGS = [];   // e.g. ["Jupyter Notebook", "HTML"]
            const TOP_LANGS = 8;        // the rest are grouped as "Other"
            const TIMEZONE = "America/New_York";   // for the commit clock
            const TICKER_EXTRA = ["NYU · HONORS MATH + CS", "QUANT DEV", "C++23"];  // extra ticker items
            // --------------------------------

            const fs = require("fs");
            const login = context.repo.owner;

            const { user } = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks { contributionDays { date contributionCount contributionLevel } }
                    }
                  }
                  repositories(first: 100, ownerAffiliations: OWNER, isFork: false, privacy: PUBLIC) {
                    nodes {
                      name
                      languages(first: 20, orderBy: { field: SIZE, direction: DESC }) {
                        edges { size node { name color } }
                      }
                    }
                  }
                }
              }`, { login });

            // Commit timestamps for the commit clock: your commits in your own repos, last year.
            const since = new Date(Date.now() - 365 * 864e5).toISOString();
            const hours = new Array(24).fill(0);
            let commitCount = 0;
            for (const repo of user.repositories.nodes) {
              if (EXCLUDE_REPOS.includes(repo.name)) continue;
              try {
                const commits = await github.paginate(github.rest.repos.listCommits, {
                  owner: login, repo: repo.name, author: login, since, per_page: 100,
                });
                for (const c of commits) {
                  const h = Number(new Intl.DateTimeFormat("en-US", {
                    hour: "numeric", hour12: false, timeZone: TIMEZONE,
                  }).format(new Date(c.commit.author.date))) % 24;
                  hours[h]++; commitCount++;
                }
              } catch (e) { core.warning(`${repo.name}: ${e.message}`); }   // e.g. empty repo
            }
            const peakHour = hours.indexOf(Math.max(...hours));
            const fmtHour = h => `${((h + 11) % 12) + 1}${h < 12 ? "am" : "pm"}`;

            // GitHub dark palette, so the cards blend into the page background.
            const BG = "#0d1117";
            const ACCENT = "#539bf5", TEXT = "#ADBAC7", MUTED = "#768390";
            const EMPTY = "#151b23", TRACK = "#21262d";
            const BLUES = ["#1B4A80", "#2F6DB5", "#539BF5", "#96D0FF"];
            const FONT = "'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif";

            const fmt = n => n.toLocaleString("en-US");
            const rand = (lo, hi) => lo + Math.random() * (hi - lo);

            const open = (w, h, title, css = "") => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
            <style>
              .header{font:600 17px ${FONT};fill:${ACCENT}}
              .stat{font:600 13px ${FONT};fill:${TEXT}}
              .label{font:400 11px ${FONT};fill:${MUTED}}
              .lang{font:400 12px ${FONT};fill:${TEXT}}
              ${css}
            </style>
            <rect width="${w}" height="${h}" fill="${BG}"/>`;

            const write = (name, parts) => {
              fs.mkdirSync("assets", { recursive: true });
              fs.writeFileSync(`assets/${name}`, parts.join("\n"));
              core.info(`wrote assets/${name}`);
            };

            // ===== Overview card: heatmap on top, languages below =====
            {
              const cal = user.contributionsCollection.contributionCalendar;
              const weeks = cal.weeks.map(w => w.contributionDays).slice(-WEEKS_SHOWN);
              const cell = 14, step = 18, left = 50;
              const W = left + weeks.length * step + 21;
              const out = [];

              // --- Heatmap (y = 0) ---
              const LEVEL = { NONE: 0, FIRST_QUARTILE: 1, SECOND_QUARTILE: 2,
                              THIRD_QUARTILE: 3, FOURTH_QUARTILE: 4 };
              const top = 64;
              out.push(`<text x="25" y="28" class="header">Contributions</text>`);
              out.push(`<text x="${W - 25}" y="28" class="stat" text-anchor="end">${fmt(cal.totalContributions)} in the last year</text>`);

              let lastMonth = null;
              weeks.forEach((week, i) => {
                const d = new Date(week[0].date + "T00:00:00Z");
                const m = d.toLocaleString("en-US", { month: "short", timeZone: "UTC" });
                if (m !== lastMonth && i < weeks.length - 1) {
                  if (lastMonth !== null || d.getUTCDate() <= 7)
                    out.push(`<text x="${left + i * step}" y="${top - 9}" class="label">${m}</text>`);
                  lastMonth = m;
                }
              });
              [[1, "Mon"], [3, "Wed"], [5, "Fri"]].forEach(([r, label]) =>
                out.push(`<text x="20" y="${top + r * step + 11}" class="label">${label}</text>`));

              weeks.forEach((week, i) => week.forEach(day => {
                const r = new Date(day.date + "T00:00:00Z").getUTCDay();   // Sunday = row 0
                const x = left + i * step, y = top + r * step;
                const lvl = LEVEL[day.contributionLevel];
                const tip = `<title>${day.contributionCount} on ${day.date}</title>`;
                if (lvl === 0) {
                  out.push(`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" fill="${EMPTY}">${tip}</rect>`);
                } else {
                  const dur = rand(2.4, 5.5).toFixed(2), delay = rand(0, 6).toFixed(2);
                  out.push(`<rect class="on" style="--d:${dur}s;--t:-${delay}s" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" fill="${BLUES[lvl - 1]}">${tip}</rect>`);
                }
              }));

              // Less / More legend under the grid, right-aligned.
              const ls = 13, lc = 10;
              const ly = top + 7 * step + 10, lx = W - 25 - 5 * ls - 30;
              out.push(`<text x="${lx - 30}" y="${ly + 9}" class="label">Less</text>`);
              [EMPTY, ...BLUES].forEach((c, k) =>
                out.push(`<rect x="${lx + k * ls}" y="${ly}" width="${lc}" height="${lc}" rx="2" fill="${c}"/>`));
              out.push(`<text x="${lx + 5 * ls + 4}" y="${ly + 9}" class="label">More</text>`);

              // --- Languages (y = oy) ---
              const oy = ly + 34;
              const totals = {};
              for (const repo of user.repositories.nodes) {
                if (EXCLUDE_REPOS.includes(repo.name)) continue;
                for (const e of repo.languages.edges) {
                  if (EXCLUDE_LANGS.includes(e.node.name)) continue;
                  const t = (totals[e.node.name] ??= { size: 0, color: e.node.color || "#8b949e" });
                  t.size += e.size;
                }
              }
              let langs = Object.entries(totals)
                .map(([name, v]) => ({ name, ...v }))
                .sort((a, b) => b.size - a.size);
              if (langs.length > TOP_LANGS) {
                const rest = langs.slice(TOP_LANGS - 1);
                langs = [...langs.slice(0, TOP_LANGS - 1),
                         { name: "Other", color: "#8b949e", size: rest.reduce((s, l) => s + l.size, 0) }];
              }
              const sum = langs.reduce((s, l) => s + l.size, 0) || 1;
              const barW = W - 50, barY = oy + 18;

              out.push(`<text x="25" y="${oy}" class="header">Most Used Languages</text>`);
              out.push(`<defs><clipPath id="bar"><rect x="25" y="${barY}" width="${barW}" height="10" rx="5"/></clipPath></defs>`);
              out.push(`<rect x="25" y="${barY}" width="${barW}" height="10" rx="5" fill="${TRACK}"/>`);
              out.push(`<g clip-path="url(#bar)">`);
              let bx = 25;
              for (const l of langs) {
                const sw = barW * l.size / sum;
                out.push(`<rect x="${bx.toFixed(2)}" y="${barY}" width="${(sw + 0.5).toFixed(2)}" height="10" fill="${l.color}"/>`);
                bx += sw;
              }
              out.push(`</g>`);

              // Legend items flow left to right and wrap to a new row if needed.
              let x = 25, y = barY + 34;
              for (const l of langs) {
                const label = `${l.name} ${(100 * l.size / sum).toFixed(1)}%`;
                const w = 18 + label.length * 7 + 18;
                if (x + w > W - 25) { x = 25; y += 22; }
                out.push(`<circle cx="${x + 5}" cy="${y - 4}" r="5" fill="${l.color}"/>`);
                out.push(`<text x="${x + 16}" y="${y}" class="lang">${label}</text>`);
                x += w;
              }
              // --- Commit clock (y = cy0) ---
              const cy0 = y + 38;
              out.push(`<text x="25" y="${cy0}" class="header">Commit Clock</text>`);
              out.push(`<text x="${W - 25}" y="${cy0}" class="stat" text-anchor="end">peak ${fmtHour(peakHour)} · ${fmt(commitCount)} commits</text>`);
              const ch = 42, cb = cy0 + 16 + ch;                  // bar area height, baseline
              const cw = (W - 50) / 24, cg = 3;
              const maxH = Math.max(1, ...hours);
              hours.forEach((n, h) => {
                const bh = Math.max(2, ch * n / maxH);
                const col = h === peakHour ? BLUES[3] : n === 0 ? EMPTY : BLUES[1];
                out.push(`<rect class="clk" style="--i:${h}" x="${(25 + h * cw).toFixed(1)}" y="${(cb - bh).toFixed(1)}" width="${(cw - cg).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${col}"><title>${n} commits at ${fmtHour(h)}</title></rect>`);
              });
              [0, 6, 12, 18].forEach(h =>
                out.push(`<text x="${(25 + h * cw).toFixed(1)}" y="${cb + 13}" class="label">${fmtHour(h)}</text>`));

              // --- Ticker tape (y = ty0) ---
              const ty0 = cb + 30, tH = 24;
              const items = [
                ...PROJECTS.map(p => `${p.slug.toUpperCase()} ▲ ${p.pct}%`),
                `CONTRIB ▲ ${fmt(cal.totalContributions)}`,
                ...langs.slice(0, 3).map(l => `${l.name.toUpperCase()} ${(100 * l.size / sum).toFixed(1)}%`),
                ...TICKER_EXTRA,
              ];
              const tape = items.join("      ◆      ") + "      ◆      ";
              const tapeW = tape.length * 7.6;                     // approx px at 12px mono
              out.push(`<defs><clipPath id="tape"><rect x="25" y="${ty0}" width="${W - 50}" height="${tH}"/></clipPath></defs>`);
              out.push(`<rect x="25" y="${ty0}" width="${W - 50}" height="${tH}" rx="4" fill="${TRACK}"/>`);
              out.push(`<g clip-path="url(#tape)"><g class="tape" style="--w:${tapeW.toFixed(0)}px">`);
              for (const k of [0, 1])
                out.push(`<text x="${(25 + k * tapeW).toFixed(0)}" y="${ty0 + 16}" class="tick">${tape}</text>`);
              out.push(`</g></g>`);
              const H = ty0 + tH + 20;

              write("overview.svg", [
                open(W, H, `${fmt(cal.totalContributions)} contributions in the last year; most used languages`, `
                  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
                  .on{animation:blink var(--d) ease-in-out infinite;animation-delay:var(--t)}
                  .clk{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 40ms)}
                  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
                  .tick{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:${BLUES[3]};letter-spacing:.5px}
                  .tape{animation:scroll ${Math.max(20, Math.round(tapeW / 45))}s linear infinite}
                  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--w)))}}
                  @media (prefers-reduced-motion:reduce){.on,.clk,.tape{animation:none}}`),
                ...out,
                `</svg>`,
              ]);
            }

            // ===== Project progress bars (full width) =====
            for (const p of PROJECTS) {
              const W = 1200, H = 16, barW = W - 50 - 52;
              const fillW = barW * Math.min(Math.max(p.pct, 0), 100) / 100;
              const out = [open(W, H, `${p.slug}: ${p.pct}% complete`, `
                .fill{transform-box:fill-box;transform-origin:left;transform:scaleX(0);
                      animation:grow 1.8s cubic-bezier(.2,.8,.2,1) .2s forwards}
                @keyframes grow{to{transform:scaleX(1)}}
                .shine{animation:shine 2.8s ease-in-out 2s infinite;transform:translateX(-80px)}
                @keyframes shine{0%{transform:translateX(-80px)}60%,100%{transform:translateX(${(fillW + 80).toFixed(0)}px)}}
                @media (prefers-reduced-motion:reduce){.fill{animation:none;transform:none}.shine{display:none}}`)];
              out.push(`<defs>
                <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${BLUES[0]}"/><stop offset="1" stop-color="${BLUES[2]}"/></linearGradient>
                <linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
                <clipPath id="c"><rect x="25" y="4" width="${fillW.toFixed(2)}" height="6" rx="3"/></clipPath>
              </defs>`);
              out.push(`<rect x="25" y="4" width="${barW}" height="6" rx="3" fill="${TRACK}"/>`);
              out.push(`<rect class="fill" x="25" y="4" width="${fillW.toFixed(2)}" height="6" rx="3" fill="url(#g)"/>`);
              out.push(`<g clip-path="url(#c)"><rect class="shine" x="25" y="4" width="80" height="6" fill="url(#s)"/></g>`);
              out.push(`<text x="${W - 25}" y="11" class="stat" text-anchor="end">${p.pct}%</text>`);
              out.push(`</svg>`);
              write(`progress-${p.slug}.svg`, out);
            }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
